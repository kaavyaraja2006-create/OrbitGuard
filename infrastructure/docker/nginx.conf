server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;   # real client IP for sign-in rate limiting
        proxy_read_timeout 300s;
    }

    location /cesium/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
